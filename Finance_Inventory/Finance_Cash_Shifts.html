<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triple E — Cash Shift Reports</title><link rel="stylesheet" href="app-ui.css"><style>body{padding:32px}main{max-width:1100px;margin:auto}.table-wrapper{overflow:auto}table{width:100%}td,th{padding:12px;text-align:left}#message{margin:16px 0}</style></head><body><main><h1>Cash Shift Reports</h1><p>Finance/Admin — Cashier reconciliation history</p><p><a href="Finance_Inventory.html">← Finance Dashboard</a></p><button id="reload" class="btn-primary">Refresh</button><p id="message"></p><div class="panel table-wrapper"><table><thead><tr><th>Cashier</th><th>Opened</th><th>Closed</th><th>Opening</th><th>Cash Sales</th><th>Expected</th><th>Actual</th><th>Difference</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');const peso=n=>n==null?'—':'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});const date=n=>n?new Date(n).toLocaleString('en-PH'):'Open';
async function load(){const m=document.getElementById('message');try{const r=await fetch('/api/pos/cash-shifts/history',{credentials:'same-origin'});if(r.status===401){location.href='Login_Inventory.html';return}if(r.status===403)throw Error('Finance access required.');const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load');m.textContent=data.length+' shift(s)';document.getElementById('rows').innerHTML=data.map(s=>`<tr><td>${esc(s.cashierName)}</td><td>${esc(date(s.openedAt))}</td><td>${esc(date(s.closedAt))}</td><td>${peso(s.openingCash)}</td><td>${peso(s.cashSales)}</td><td>${peso(s.expectedCash)}</td><td>${peso(s.closingCash)}</td><td>${peso(s.difference)}</td><td>${esc(s.closingNote)}</td></tr>`).join('')||'<tr><td colspan="9">No shifts yet.</td></tr>';}catch(e){m.textContent=e.message}}document.getElementById('reload').onclick=load;load();</script></body></html>
